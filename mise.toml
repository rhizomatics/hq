[settings]
# Cooldown for tool upgrades (policies/project_standards.md)
minimum_release_age = "7d"

[tools]
node = "lts"

[tasks.preview-site]
description = "Build the public site from hq and ../hq-private, then serve it at http://localhost:4321/"
dir = "site"
run = ["npm ci", "GITHUB_TOKEN=\"${GITHUB_TOKEN:-$(gh auth token)}\" npm run build", "npx astro preview"]
