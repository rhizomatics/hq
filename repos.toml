# Registry of the org's repos and where each one is distributed, plus the org-specific settings every
# process, skill and site script reads instead of naming the org itself.
# Single source of truth for every process: stats collection, sweeps, alignment reviews.
#
# [org]
#   name:          display name, used in prose and on the site
#   github:        GitHub org (or user) that owns the repos
#   maintainers:   GitHub logins of the human maintainers; the first is assigned hq issues
#   hq_repo:       the public repo holding these docs (this repo)
#   private_repo:  repo for reports, data snapshots and hq issues, checked out next to hq_repo;
#                  omit for an entirely public set-up (hq issues then go in hq_repo)
#   site_url:      where the public HQ site is served
# [stats]:         usage stats by @rhizomatics/hq-stats (projects/hq-stats.md); paths relative to this file
#   data_dir:      daily snapshots, written by .github/workflows/collect-stats.yml
#   legacy_hacs:   history from the retired hacs-downloads site
#   out:           the aggregate the site's Usage pages are built from (not committed)
# [families]:      each repo family, in display order: its heading on the site and its hq issue area
# [labels]:        hq issue labels; an issue gets one source and one area (the areas are the `area`
#                  values in [families])
#
# Per repo:
# family:     a key of [families]
# npm/pypi:   published package name
# ghcr:       container image name under ghcr.io/<org.github>/
# ha_domain:  Home Assistant integration domain (for HA analytics install counts)
# hacs_zip:   release asset name HACS downloads, a zip or a card's .js (counts = HACS installs/updates)
# formerly:   names a renamed product had before, still counted: { name, hacs_zip, npm, pypi, ha_domain }
# upstream:   platform whose transitive vulns are excluded from security escalation
# goatcounter: GoatCounter site code counting page views of the repo's website (docs site, www, the HQ site);
#             cookieless, so no consent banner (policies/project_standards.md)
# archived:   true when retired; left off the public site (Usage, Operations) even before GitHub archives it
#
# [community.<id>]: contributed projects built on the org's products, by other people. Tracked for stats and
# reputation, never counted in the org's own totals (projects/hq-as-product.md, "Community"). Public projects
# only, added with the maintainer's approval.
#   kind:     "project" (the default) or "blog"
#   A project:
#     repo:     owner/name on GitHub
#     author:   GitHub login of the author
#     extends:  the org's repo it builds on (a key of [repos])
#     plus the same channel fields as a repo (npm, pypi, hacs_zip, ...)
#   A blog (writing about the products or their platforms):
#     url:      the blog's home page; its RSS feed gives the description and latest posts
#     title:    the blog's name, shown even when its feed can't be read
#     author:   the byline the blog itself uses
#     note:     optional, shown with it (e.g. that it's the maintainer's personal blog)
#
# [capabilities.<id>]: who provides each recurring capability, so an HQ skill can be swapped for a better one
# made by someone else (projects/hq-as-product.md, "Reuse skill packages first"; the survey behind these is
# reference/skill_providers.md). `providers` is a list, in order of preference, each:
#   kind:    "hq"      a skill in .claude/skills (ref: its name)
#            "gh-aw"   a GitHub agentic workflow (ref: owner/repo/path.md@<sha>; where: the repo it runs in)
#            "skill"   a third-party agent skill or plugin (ref: package@version)
#            "action"  a scanner run in CI (ref: owner/repo@<version>; where: "admin" for the shared callers,
#                      or the repos that run it)
#            "service" a GitHub feature, app or hosted service (ref: its name)
#   ref, where, note
#   status:  "active" (default) | "trial" (runs beside the active ones until compared) | "candidate" (chosen,
#            not running yet)
# Every skill in .claude/skills is the hq provider of exactly one capability; `mise run check-hq` checks this.

# security_watch: platform packages our users run but we don't patch, so Dependabot's alerts don't
# reach the decision that matters. Advisories for them are snapshotted by collect_github.py.
# ecosystem is the GitHub advisory API's name (pip, npm); area is the hq issue label.

[org]
name = "Rhizomatics"
github = "rhizomatics"
maintainers = ["jeyrb"]
hq_repo = "hq"
private_repo = "hq-private"
site_url = "https://hq.rhizomatics.org.uk"

[stats]
data_dir = "data/stats"
legacy_hacs = "data/legacy/hacs-downloads-history.json"
out = "site/src/data/stats.json"

[families]
ha-integration = { label = "Home Assistant", area = "homeassistant" }
signalk-plugin = { label = "SignalK", area = "signalk" }
mqtt-service = { label = "MQTT", area = "mqtt" }
cli = { label = "Command line", area = "org" }
picoware = { label = "Picoware", area = "org" }
site = { label = "Sites", area = "org" }
meta = { label = "Organisation", area = "org" }

[labels]
sources = [
  "security-escalation", "dependabot", "support", "forums", "alignment", "github", "docs",
  "architecture", "platform", "reputation", "roadmap", "project", "adoption", "prs",
]

[[security_watch]]
ecosystem = "npm"
package = "signalk-server"
area = "signalk"

[[security_watch]]
ecosystem = "npm"
package = "@signalk/resources-provider"
area = "signalk"

[[security_watch]]
ecosystem = "pip"
package = "homeassistant"
area = "homeassistant"

# Capabilities and their providers (header above). Trials started 2026-11-19 run two weeks.

[capabilities.support]
providers = [
  { kind = "hq", ref = "support-sweep" },
  { kind = "gh-aw", ref = "github/awesome-copilot/workflows/ospo-org-health.md@1683f50e94c9fd489191f73d7c8f7e2bd871bd0c", where = "hq-private", status = "trial", note = "OSPO Organization Health Report; stale issues and items needing a human" },
]

[capabilities.pull-requests]
providers = [
  { kind = "hq", ref = "pr-report" },
  { kind = "gh-aw", ref = "github/awesome-copilot/workflows/ospo-org-health.md@1683f50e94c9fd489191f73d7c8f7e2bd871bd0c", where = "hq-private", status = "trial", note = "the same report's stale-PR and merge-time sections" },
]

[capabilities.dependency-updates]
providers = [
  { kind = "hq", ref = "dependabot-sweep" },
  { kind = "action", ref = "rhizomatics/hq/.github/workflows/reusable-dependabot-automerge.yml", where = "admin", note = "merges the trusted bumps itself; the sweep handles the rest" },
]

[capabilities.security]
providers = [
  { kind = "hq", ref = "security-escalation", note = "merges, de-duplicates and ranks every provider below; applies the escalation rules" },
  { kind = "service", ref = "dependabot-alerts" },
  { kind = "service", ref = "codeql" },
  { kind = "service", ref = "secret-scanning" },
  { kind = "action", ref = "ossf/scorecard-action@v2.4.1", where = "every released repo (scorecard.yml)" },
  { kind = "action", ref = "anchore/scan-action@v7.4.2", where = "image repos (image-scan.yml)", note = "Grype, container images" },
  { kind = "action", ref = "zizmorcore/zizmor-action@v0.8.1", where = "admin", note = "Actions workflow audit, in every repo since hq v1.0.1; patterns in policies/release_workflows.md" },
  { kind = "service", ref = "socket.dev", status = "candidate", note = "malicious and risky npm/PyPI packages with no CVE; GitHub App, the maintainer's decision" },
]

[capabilities.registry]
providers = [
  { kind = "hq", ref = "registry-check" },
  { kind = "gh-aw", ref = "github/awesome-copilot/workflows/ospo-stale-repos.md@1683f50e94c9fd489191f73d7c8f7e2bd871bd0c", where = "hq-private", status = "trial", note = "inactive repos and archival candidates; covers part of the check" },
]

[capabilities.github-settings]
providers = [
  { kind = "hq", ref = "github-review" },
  { kind = "gh-aw", ref = "github/awesome-copilot/workflows/ospo-release-compliance-checker.md@1683f50e94c9fd489191f73d7c8f7e2bd871bd0c", where = "hq-private", status = "trial", note = "community files and security settings, one repo per labelled issue" },
]

[capabilities.adoption]
providers = [
  { kind = "hq", ref = "adoption-report" },
  { kind = "gh-aw", ref = "github/awesome-copilot/workflows/ospo-contributors-report.md@1683f50e94c9fd489191f73d7c8f7e2bd871bd0c", where = "hq-private", status = "trial", note = "contributor activity only; downloads have no third-party provider" },
]

[capabilities.alignment]
providers = [{ kind = "hq", ref = "alignment-review" }]

[capabilities.docs]
providers = [{ kind = "hq", ref = "docs-review" }]

[capabilities.agent-accessibility]
providers = [{ kind = "hq", ref = "agent-accessibility-review" }]

[capabilities.releases]
providers = [{ kind = "hq", ref = "release-digest" }]

[capabilities.forums]
providers = [{ kind = "hq", ref = "forum-watch" }]

[capabilities.reputation]
providers = [{ kind = "hq", ref = "reputation-review" }]

[capabilities.support-themes]
providers = [{ kind = "hq", ref = "support-review" }]

[capabilities.roadmaps]
providers = [{ kind = "hq", ref = "roadmap-review" }]

[capabilities.architecture]
providers = [{ kind = "hq", ref = "architecture-review" }]

[capabilities.platforms]
providers = [{ kind = "hq", ref = "platform-review" }]

[capabilities.policies]
providers = [{ kind = "hq", ref = "policy-review" }]

[capabilities.projects]
providers = [{ kind = "hq", ref = "project-review" }]

