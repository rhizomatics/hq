name: Collect stats

# Daily usage snapshot by @rhizomatics/hq-stats (projects/hq-stats.md): downloads per channel, GitHub stars,
# repo views and clones, and website page views for the repos in repos.toml, committed to data/stats/.
# The site builds its Usage pages from them (site.yml, next scheduled run).
# The package version is the one in site/package-lock.json, so Dependabot keeps it current.
#
# Secrets:
#   STATS_TOKEN        fine-grained PAT, rhizomatics org, all repos: read-only "Administration" (traffic API)
#                      and "Metadata". Without it, views and clones are recorded as errors.
#   GOATCOUNTER_TOKEN  GoatCounter API key with "Read statistics", for repos with `goatcounter`.
#
# Schedule and manual dispatch only, never pull requests: the token reads traffic for every repo.

on:
  schedule:
    # Off the top of the hour: GitHub queues scheduled runs, and :00 is the busiest slot.
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: collect-stats

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        working-directory: site
        run: npm ci --ignore-scripts
      - name: Snapshot
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: npx --no-install hq-stats collect --config ../repos.toml
      - name: Commit
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/stats
          git diff --cached --quiet && exit 0
          git commit -m "stats: $(date -u +%F)"
          remote="https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Agents and the maintainer push to main too; snapshots are new dated files, so rebasing never conflicts.
          for attempt in 1 2 3; do
            git push "$remote" HEAD:main && exit 0
            sleep $((attempt * 5))
            git pull --rebase "$remote" main
          done
          exit 1
