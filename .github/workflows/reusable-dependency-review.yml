# Reusable: flag known-vulnerable dependencies added or changed by a PR.
# Callers trigger on `pull_request`. See https://github.com/actions/dependency-review-action
name: Dependency review

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: on-failure
