name: Site

# Builds the public HQ site (site/) and deploys it to GitHub Pages: hq's docs, the reports that
# processes declare public, the Usage pages from the daily snapshots in data/stats (@rhizomatics/hq-stats), and each public
# repo's Actions state, open issue counts and public security settings (read with this run's token;
# actions: read). Security alerts are never read or published.
# Runs at 00:40, 08:40 (after collect-stats.yml's 04:23 snapshot) and 16:40 to refresh the Operations pages,
# and on doc or site changes.
# Logs are public: the build scripts only print counts, file names and public source errors.

on:
  push:
    branches: [main]
    paths:
      - site/**
      - policies/**
      - processes/**
      - projects/**
      - reference/**
      - team.md
      - hq.toml
      - products.toml
      - community.toml
      - data/**
      - assets/**
      - .github/workflows/site.yml
  schedule:
    - cron: "40 0 * * *"
    - cron: "40 8 * * *"
    - cron: "40 16 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reports, release and community data from the private repo (hq.toml org.private_repo). Fine-grained PAT: that repo only, read-only Contents.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/hq-private
          token: ${{ secrets.HQ_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: hq-private
          sparse-checkout: |
            data/github
            data/releases
            data/community
            reports
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build
        working-directory: site
        env:
          HQ_PRIVATE: ${{ github.workspace }}/hq-private
          GITHUB_TOKEN: ${{ github.token }}
          ASTRO_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
