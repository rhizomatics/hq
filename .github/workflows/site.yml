name: Site

# Builds the public HQ site (site/) and deploys it to GitHub Pages: hq's docs, the reports that
# processes declare public, the Usage pages from the daily snapshots in data/stats (@rhizomatics/hq-stats), and each public
# repo's Actions state, open issue counts and public security settings (read with this run's token;
# actions: read). Security alerts are never read or published.
# Runs at 00:40, 08:40 (after collect-stats.yml's 04:23 snapshot) and 16:40 to refresh the Operations pages,
# and on doc or site changes.
# Only the scheduled (and manual) builds read GitHub's API for the Operations, Design and Releases data, then save
# it to the Actions cache; a build on push restores the newest copy and skips those scripts, so a busy day of
# pushes doesn't use up this repo's API allowance (1,000 requests an hour, shared with everything else here).
# The Operations pages can therefore lag a push by up to 8 hours.
# Logs are public: the build scripts only print counts, file names and public source errors.

on:
  push:
    branches: [main]
    paths:
      - site/**
      - policies/**
      - processes/**
      - projects/**
      - reference/**
      - team.md
      - hq.toml
      - products.toml
      - community.toml
      - data/**
      - assets/**
      - .github/workflows/site.yml
  schedule:
    - cron: "40 1 * * *"
    - cron: "40 7 * * *"
    - cron: "40 13 * * *"
    - cron: "40 19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history: the projects list dates each project from when it moved between folders
      # Reports, release and community data from the private repo (hq.toml org.private_repo). Fine-grained PAT: that repo only, read-only Contents.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/hq-private
          token: ${{ secrets.HQ_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: hq-private
          sparse-checkout: |
            data/github
            data/releases
            data/community
            reports
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # On push: the GitHub data the last scheduled build saved (newest first by key prefix).
      - name: Restore GitHub data
        id: github-data
        if: github.event_name == 'push'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            site/src/data/actions.json
            site/src/data/design.json
            site/src/data/issues.json
            site/src/data/security.json
            site/src/data/releases.json
          key: site-github-data-
          restore-keys: site-github-data-
      - name: Build
        working-directory: site
        env:
          HQ_PRIVATE: ${{ github.workspace }}/hq-private
          GITHUB_TOKEN: ${{ github.token }}
          ASTRO_TELEMETRY_DISABLED: "1"
          CACHED: ${{ steps.github-data.outputs.cache-matched-key != '' }}
        run: |
          npm ci
          if [ "$CACHED" = "true" ]; then npm run build:cached; else npm run build; fi
      # Scheduled and manual builds save the GitHub data they read, for the builds on push to reuse.
      - name: Save GitHub data
        if: github.event_name != 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            site/src/data/actions.json
            site/src/data/design.json
            site/src/data/issues.json
            site/src/data/security.json
            site/src/data/releases.json
          key: site-github-data-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
