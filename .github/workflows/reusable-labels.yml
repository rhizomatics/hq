# Reusable: sync the shared label set in rhizomatics/hq admin/labels.yml into the calling repo.
# Labels that exist only in the calling repo are left alone (skip-delete).
name: Sync labels (shared)

on:
  workflow_call:

# Nothing by default; the job grants only what it needs (OpenSSF Scorecard Token-Permissions).
permissions: {}

jobs:
  labels:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Fetch shared label set
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rhizomatics/hq
          persist-credentials: false
          sparse-checkout: admin/labels.yml
          sparse-checkout-cone-mode: false

      - name: Sync labels
        uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d
        with:
          yaml-file: admin/labels.yml
          skip-delete: true
