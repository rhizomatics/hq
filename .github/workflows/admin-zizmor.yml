# Managed by rhizomatics/hq (admin/sync-admin.sh) - edit there, not here.
name: zizmor

on:
  # zizmor audits workflows only, and its online checks use this repo's API allowance: on main, run it when they
  # or its config change. Every pull request still gets it (it may be a required check), and the weekly run
  # picks up new advisories for the actions in use.
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - .github/zizmor.yml
  pull_request:
  schedule:
    - cron: "41 5 * * 2"

# Nothing by default; each job grants only what it needs (OpenSSF Scorecard Token-Permissions).
permissions: {}

jobs:
  zizmor:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: rhizomatics/hq/.github/workflows/reusable-zizmor.yml@0b71f7ee4e19ea72a529b96395fa81eeb641a590 # v1.0.1
